name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  optimizer:
    name: Optimizer checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          gofmt -l cmd internal | tee /tmp/fmt.out
          test ! -s /tmp/fmt.out

      - name: go vet
        run: go vet ./internal/... ./cmd/...

      - name: go test
        run: go test ./internal/... ./cmd/...

      - name: Build CLI binary
        run: go build ./cmd/gumi

  legacy-runtime:
    name: Legacy runtime checks (frozen)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod

      - name: go vet
        run: cd runtime && go vet ./...

      - name: go test
        run: cd runtime && go test ./...

  diff-check:
    name: git diff --check
    runs-on: ubuntu-latest
    needs: [optimizer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check merge conflicts and whitespace
        run: git diff --check
